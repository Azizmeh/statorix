<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statorix - Dashboards Base Sirene</title>
    <link rel="icon" type="image/svg+xml" href="/statorix_icon.svg">
    <link rel="stylesheet" href="/statorix.css">

    <style>
        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 0 0 0;
        }

        #search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        #search:focus {
            border-color: #2563eb;
            outline: 2px solid rgba(37, 99, 235, .12);
            outline-offset: 0;
        }

        #tree {
            width: 100%;
        }

        .tree {
            width: 100%;
        }

        .tree ul {
            list-style: none;
            padding-left: 25px;
        }

        .tree li {
            margin: 6px 0;
            width: 100%;
        }

        .node {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            width: 100%;
            min-width: 700px;
        }

        .node:hover {
            background: #e0ecff;
        }

        .code {
            color: #666;
            font-size: 12px;
            margin-right: 6px;
        }

        .children {
            display: none;
        }

        .open>.children {
            display: block;
        }

        .arrow {
            display: inline-flex;
            width: 24px;
            min-width: 24px;
            justify-content: center;
            color: #2563eb;
        }

        .highlight {
            background: yellow;
        }

        /* conteneur global */
        .layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            width: 100%;
        }

        /* bloc principal */
        .container1 {
            flex: 1;
            min-width: 0;
            max-width: 1000px;
            margin-left: 60px;
        }

        /* bloc de droite */
        .info-box {
            max-width: 300px;
            margin-top: 40px;
            width: 280px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        /* titre */
        .info-box h3 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 18px;
            color: #1f2937;
        }

        /* lignes */
        .level-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .level-item:last-child {
            border-bottom: none;
        }

        .level {
            font-weight: 300;
            color: #2563eb;
        }

        .label {
            color: #374151;
        }

        /* responsive */
        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }

            .info-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="/index.html">
            <img src="/statorix_logo.svg" width="350" alt="Statorix Logo">
        </a>
        <div id="auth-zone">
            <a class="btn-connect" href="http://localhost:8088/login/keycloak">Se connecter</a>
        </div>
    </header>

    <div class="layout">
        <!-- Bloc gauche -->
        <div class="container1">
            <h3>Arborescence des activités NAF REV2</h3>
            <div class="search-box">
                <input id="search" placeholder="Recherche dans les activités...">
            </div>
            <div id="tree" class="tree"></div>
        </div>

        <!-- Nouveau bloc à droite -->
        <div class="info-box">
            <h3>Niveaux de l'arborescence</h3>

            <div class="level-item">
                <span class="level">Niveau 1</span>
                <span class="label">Section</span>
            </div>

            <div class="level-item">
                <span class="level">Niveau 2</span>
                <span class="label">Division</span>
            </div>

            <div class="level-item">
                <span class="level">Niveau 3</span>
                <span class="label">Groupe</span>
            </div>

            <div class="level-item">
                <span class="level">Niveau 4</span>
                <span class="label">Classe</span>
            </div>

            <div class="level-item">
                <span class="level">Niveau 5</span>
                <span class="label">Activité</span>
            </div>
        </div>
    </div>

    <footer>
        <a href="/infos_donnees.html">Informations sur les données</a>
        |
        <a href="/contact.html">Contact</a>
    </footer>

    <script>
        async function loadXML() {
            const response = await fetch("activites.xml");
            const text = await response.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");

            const root = xml.documentElement;
            const tree = document.getElementById("tree");

            tree.appendChild(renderChildren(root.children));
        }

        function renderChildren(nodes) {
            const ul = document.createElement("ul");

            [...nodes].forEach(node => {
                ul.appendChild(renderNode(node));
            });

            return ul;
        }

        function renderNode(node) {
            const li = document.createElement("li");

            const hasChildren = node.children.length > 0;

            const div = document.createElement("div");
            div.className = "node";

            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.textContent = hasChildren ? "▶" : "•";

            const code = document.createElement("span");
            code.className = "code";
            code.textContent = node.getAttribute("code");

            const label = document.createElement("span");
            label.className = "label";
            label.textContent = node.getAttribute("libelle");

            div.appendChild(arrow);
            div.appendChild(code);
            div.appendChild(label);

            li.appendChild(div);

            if (hasChildren) {
                const children = renderChildren(node.children);
                children.className = "children";
                li.appendChild(children);

                div.onclick = () => {
                    li.classList.toggle("open");
                    arrow.textContent =
                        li.classList.contains("open") ? "▼" : "▶";
                };
            }

            return li;
        }

        document.getElementById("search").addEventListener("input", e => {
            const value = e.target.value.toLowerCase().trim();

            const root = document.querySelector("#tree > ul");
            filterTree(root, value);
        });

        function filterTree(ul, search) {
            if (!ul) return false;

            let hasVisible = false;

            [...ul.children].forEach(li => {
                const node = li.querySelector(":scope > .node");
                const label = node.querySelector(".label");
                const children = li.querySelector(":scope > .children");

                const text = node.textContent.toLowerCase();
                const selfMatch = text.includes(search);

                let childMatch = false;

                if (children) {
                    childMatch = filterTree(children, search);
                }

                const visible = search === "" || selfMatch || childMatch;

                li.style.display = visible ? "" : "none";

                if (children) {
                    const arrow = node.querySelector(".arrow");

                    if (search && childMatch) {
                        li.classList.add("open");
                        arrow.textContent = "▼";
                    } else if (!search) {
                        li.classList.remove("open");
                        arrow.textContent = "▶";
                    }
                }
                highlightText(label, search);
                if (visible) hasVisible = true;
            });

            return hasVisible;
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightText(element, search) {
            const original = element.dataset.original || element.textContent;

            element.dataset.original = original;

            if (!search) {
                element.innerHTML = original;
                return;
            }

            const regex = new RegExp(`(${escapeRegExp(search)})`, "gi");

            element.innerHTML = original.replace(
                regex,
                '<span class="highlight">$1</span>'
            );
        }
        loadXML();
    </script>
    <script>
        fetch('/superset-api/v1/me/', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data && data.result && data.result.username) {
                    const user = data.result;
                    const name = (user.first_name + ' ' + user.last_name).trim() || user.username;
                    document.getElementById('auth-zone').innerHTML = `
                        <span>👤 ${name}</span>
                        <a class="btn-logout" href="http://localhost:8088/logout/">Se déconnecter</a>
                    `;
                }
            })
            .catch(() => { });
    </script>

</body>

</html>
